# mise SETTINGS — policy about HOW mise installs; nobody changes this per
# machine with a `mise` subcommand, so it stays declarative (chezmoi-managed and
# re-applied on every `chezmoi apply`). The TOOLS half is
# ~/.config/mise/config.toml: seeded from home/.chezmoidata/mise.toml, reconciled
# by scripts/runtimes.py (missing tools added, existing ones left alone), and
# otherwise mise's own.
#
# It lives in conf.d rather than config.toml because conf.d always OVERRIDES
# config.toml (mise says so itself), which is what settings want and exactly
# what tools do not. Named `zz-` on purpose: within conf.d the lexically FIRST
# file wins, so any host-local conf.d file a user drops in still beats this one.
[settings]
experimental = true
