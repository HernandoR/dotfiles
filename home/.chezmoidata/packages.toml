# The system-level remainder: tools that must come from the OS package manager
# (ADR-0013). Everything mise can fetch as a release binary lives in mise.toml
# instead; the Node ecosystem is nvm's (node.toml). What is left here links
# against the system, replaces something the OS ships, or has no mise backend:
# the shell, GNU userland, git, vim, wget/rsync/tree, the X clipboard.
#
# scripts/packages.py detects the host's manager — brew on macOS; apt, dnf or
# yum on Linux (yum uses the dnf names); brew as a last resort — and installs
# the missing entries. A chezmoi run_onchange script runs it when this file or
# the script changes; `just packages` runs it by hand.
#
# Keys per entry:
#   name     display name
#   bin      the executable to probe afterwards (default: name)
#   brew / apt / dnf   the native names ("" = not packaged there)
#   cask     macOS: install as a brew cask instead of a formula
#   zoi      a zoi registry package id, tried first when present (none today)
#   mise     a last-resort mise tool spec (`mise use -g <spec>@latest`)
#   alias    { <bin> = "<other bin>" }: symlink ~/.local/bin/<bin> to a
#            differently named native binary
#   only     "linux" | "darwin"

# --- GNU userland: `ls --color=auto`, `sed -i`, `grep --color` behave the same
# on macOS as on Linux. macOS gets them from brew (env.zsh puts the gnubin dirs
# on PATH); Linux ships them.
[[packages]]
name = "coreutils"
bin = "ls"
brew = "coreutils"
apt = "coreutils"
dnf = "coreutils"

[[packages]]
name = "findutils"
bin = "find"
brew = "findutils"
apt = "findutils"
dnf = "findutils"

[[packages]]
name = "gnu-sed"
bin = "sed"
brew = "gnu-sed"
apt = "sed"
dnf = "sed"

[[packages]]
name = "gnu-grep"
bin = "grep"
brew = "grep"
apt = "grep"
dnf = "grep"

# --- the shell itself (the login shell; setup.py chsh's to it) ---
[[packages]]
name = "zsh"
brew = "zsh"
apt = "zsh"
dnf = "zsh"

# --- git and vim: system tools every host should have at the OS level ---
[[packages]]
name = "git"
brew = "git"
apt = "git"
dnf = "git"

[[packages]]
name = "vim"
brew = "vim"
apt = "vim"
dnf = "vim-enhanced"

# --- network / files ---
[[packages]]
name = "wget"
brew = "wget"
apt = "wget"
dnf = "wget"

[[packages]]
name = "rsync"
brew = "rsync"
apt = "rsync"
dnf = "rsync"

[[packages]]
name = "tree"
brew = "tree"
apt = "tree"
dnf = "tree"

# tmux copy/paste bindings use xclip on Linux (dot_tmux.conf).
[[packages]]
name = "xclip"
only = "linux"
brew = ""
apt = "xclip"
dnf = "xclip"
