# The system-level remainder: tools that must come from the OS package manager
# (ADR-0013). Everything mise can fetch as a release binary lives in mise.toml
# instead; the Node ecosystem is nvm's (node.toml). What is left here links
# against the system, replaces something the OS ships, or has no mise backend:
# the shell, GNU userland, git, vim, wget/rsync/tree, the X clipboard.
#
# scripts/packages.py detects the host's manager — brew on macOS; apt, dnf or
# yum on Linux (yum uses the dnf names); brew as a last resort — and installs
# the missing entries. A chezmoi run_onchange script runs it when this file or
# the script changes; `just packages` runs it by hand.
#
# Keys per entry:
#   name     display name
#   bin      the executable whose presence means "already installed, skip"
#            (default: name) — nothing the host already has is reinstalled
#   probe_darwin   macOS only: paths of which one must exist instead of `bin`
#            (the GNU tools: `ls` always resolves to BSD ls, so probe brew's gnubin)
#   brew / apt / dnf   the native names ("" = not packaged there)
#   cask     macOS: install as a brew cask instead of a formula
#   mise     a last-resort mise tool spec (`mise use -g <spec>@latest`)
#   alias    { <bin> = "<other bin>" }: symlink ~/.local/bin/<bin> to a
#            differently named native binary
#   only     "linux" | "darwin"

# --- GNU userland: `ls --color=auto`, `sed -i`, `grep --color` behave the same
# on macOS as on Linux. macOS gets them from brew (env.zsh puts the gnubin dirs
# on PATH); Linux ships them.
[[packages]]
name = "coreutils"
bin = "ls"
brew = "coreutils"
probe_darwin = ["/opt/homebrew/opt/coreutils/libexec/gnubin/ls", "/usr/local/opt/coreutils/libexec/gnubin/ls"]
apt = "coreutils"
dnf = "coreutils"

[[packages]]
name = "findutils"
bin = "find"
brew = "findutils"
probe_darwin = ["/opt/homebrew/opt/findutils/libexec/gnubin/find", "/usr/local/opt/findutils/libexec/gnubin/find"]
apt = "findutils"
dnf = "findutils"

[[packages]]
name = "gnu-sed"
bin = "sed"
brew = "gnu-sed"
probe_darwin = ["/opt/homebrew/opt/gnu-sed/libexec/gnubin/sed", "/usr/local/opt/gnu-sed/libexec/gnubin/sed"]
apt = "sed"
dnf = "sed"

[[packages]]
name = "gnu-grep"
bin = "grep"
brew = "grep"
probe_darwin = ["/opt/homebrew/opt/grep/libexec/gnubin/grep", "/usr/local/opt/grep/libexec/gnubin/grep"]
apt = "grep"
dnf = "grep"

# --- the shell itself (the login shell; setup.py chsh's to it) ---
[[packages]]
name = "zsh"
brew = "zsh"
apt = "zsh"
dnf = "zsh"

# --- git and vim: system tools every host should have at the OS level ---
[[packages]]
name = "git"
brew = "git"
apt = "git"
dnf = "git"

[[packages]]
name = "vim"
brew = "vim"
apt = "vim"
dnf = "vim-enhanced"

# --- network / files ---
[[packages]]
name = "wget"
brew = "wget"
apt = "wget"
dnf = "wget"

[[packages]]
name = "rsync"
brew = "rsync"
apt = "rsync"
dnf = "rsync"

[[packages]]
name = "tree"
brew = "tree"
apt = "tree"
dnf = "tree"

# tmux copy/paste bindings use xclip on Linux (dot_tmux.conf).
[[packages]]
name = "xclip"
only = "linux"
brew = ""
apt = "xclip"
dnf = "xclip"

# Rime input method for macOS. mise-zerobrew can manage Homebrew formulae, but
# its current backend does not support casks; Squirrel is a GUI cask. Probe
# the installed app so repeated applies stay no-op.
[[packages]]
name = "squirrel-app"
only = "darwin"
brew = "squirrel-app"
apt = ""
dnf = ""
mise = ""
cask = true
probe_darwin = ["/Applications/Squirrel.app"]
