# The user-level CLI toolset (ADR-0013). Installed by scripts/packages.py, which
# a chezmoi run_onchange script runs whenever this file (or the script) changes;
# `just packages` runs it by hand.
#
# zoi is the front door: every entry is handed to `zoi install --yes` as
# `<manager>:<name>` for the native manager of this OS (brew on macOS, apt/dnf/
# pacman/apk/zypper on Linux), or as a plain name when `zoi = "..."` names a
# package in a zoi registry. Because zoi's native passthrough is best-effort
# (measured 2026-09-09: `zoi install brew:cowsay` reported success and installed
# nothing), packages.py verifies `bin` afterwards and falls back to the native
# manager directly, then to `mise use -g <mise>` when the entry names a mise
# tool — so a tool missing from apt (bottom, jj, difft, ...) still arrives.
#
# Keys per entry:
#   name        display name
#   bin         the executable to probe afterwards (default: name)
#   zoi         a zoi registry package id, when one exists
#   brew/apt/dnf/pacman/apk/zypper   the native names ("" = not packaged there)
#   cask        macOS: install as a brew cask instead of a formula
#   mise        fallback mise tool spec (`mise use -g <spec>@latest`)
#   alias       { <bin> = "<other bin>" }: symlink ~/.local/bin/<bin> to a
#               differently named native binary (Debian's fdfind -> fd)
#   only        "linux" | "darwin" — restrict to one OS

# --- GNU userland: `ls --color=auto`, `sed -i`, `grep --color` behave the same
# on macOS as on Linux. macOS gets them from brew; env.zsh.tmpl puts the gnubin
# dirs on PATH there. Linux ships them.
[[packages]]
name = "coreutils"
bin = "ls"
brew = "coreutils"
apt = "coreutils"
dnf = "coreutils"
pacman = "coreutils"
apk = "coreutils"
zypper = "coreutils"

[[packages]]
name = "findutils"
bin = "find"
brew = "findutils"
apt = "findutils"
dnf = "findutils"
pacman = "findutils"
