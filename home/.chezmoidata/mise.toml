# Global mise tools — runtimes AND most of the CLI toolset (ADR-0013, updated
# 2026-09-10: "whatever mise can manage, mise manages — except the Node
# ecosystem, which is nvm's; see node.toml").
#
# How this reaches a machine: scripts/env_links.py seeds ~/.config/mise/config.toml
# from this table on a first run, and scripts/runtimes.py adds any tool listed
# here that the live file lacks (`mise use -g <tool>@<version>`) without touching
# the ones it has — so `mise use -g` / `mise up` on a host keep their say, and a
# tool added here still arrives everywhere on the next `chezmoi apply`.
#
# Backends (mise registry; `mise registry | grep <name>`): the short names below
# resolve to aqua (prebuilt GitHub releases, checksummed) unless noted. The
# SETTINGS half (how mise installs) is home/private_dot_config/mise/conf.d/.
#
# Deliberately NOT here — see packages.toml: zsh, git, GNU coreutils/findutils/
# sed/grep (mise's coreutils is uutils, not GNU), vim, wget, rsync, tree, xclip.

[mise.tools]
# --- runtimes ---
go = "latest"
rust = "stable"
# (node/npm/pnpm: nvm — home/.chezmoidata/node.toml)

# --- dev workflow ---
aws-cli = "latest"
just = "latest"
pre-commit = "latest"
worktrunk = "latest"
gh = "latest"
git-lfs = "latest"
jj = "latest"
difftastic = "latest"
# cargo-binstall: makes mise's cargo backend FETCH prebuilt binaries instead of
# compiling (mise's default `cargo.binstall = true` needs it on PATH — it is not
# installed automatically). runtimes.py installs it before any cargo: tool.
cargo-binstall = "latest"
# mergiraf: released on codeberg, which aqua/ubi cannot fetch; cargo-binstall
# can (verified 2026-09-10, v0.19.1 aarch64-apple-darwin). Falls back to a
# cargo build with the rust above only if no prebuilt artifact exists.
"cargo:mergiraf" = "latest"

# --- shell and prompt ---
starship = "latest"
zoxide = "latest"
fzf = "latest"
direnv = "latest"
tmux = "latest"            # aqua:tmux/tmux-builds — static builds
zellij = "latest"
eza = "latest"             # asdf:mise-plugins/mise-eza (ubi has no macOS asset)

# --- everyday CLI ---
ripgrep = "latest"
fd = "latest"
jq = "latest"
bottom = "latest"
# skopeo: conda-forge through mise's conda backend — mise solves and downloads
# the packages itself; NO conda/mamba/pixi binary is installed (checked against
# the backend docs and a scratch install, 2026-09-10).
"conda:skopeo" = "latest"
# 1Password CLI (`op`): vfox plugin fetching 1Password's own release.
1password = "latest"

# Linux only: the docker CLI is the client half; the daemon is an opt-in system
# component (`--system docker`, scripts/components.py). macOS never gets a
# daemon from this repo, so the client would be dead weight there.
[mise.linux_tools]
docker-cli = "latest"
